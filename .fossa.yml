# FOSSA CLI configuration for hivecommons/dibs.
# Reference: https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
version: 3

project:
  # Stable project name in the CNCF FOSSA org (the action's `project:` input
  # mirrors this so UI and CI agree).
  name: hivecommons/dibs
  # Team NAME in the CNCF FOSSA org (team id 207492). Only applied when the
  # project is first created; later changes must be made in the FOSSA UI.
  team: Hive Commons
  url: https://github.com/hivecommons/dibs

# Single Go module at the repo root (github.com/hivecommons/dibs). FOSSA
# auto-discovers every manifest; pin the shipped module explicitly so a future
# re-layout does not silently drop it. deploy/ and hack/ are operator tooling.
targets:
  only:
    - type: gomod
      path: .

paths:
  exclude:
    - docs
    - deploy
    - hack
    - runbooks
