name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format and module tidiness
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: the following files need formatting:"; echo "$unformatted"; exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1
          }
      - name: Test
        run: |
          go test -race -count=1 \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          {
            echo "### Go coverage (\`-coverpkg=./...\`): ${total}%"
            echo
            echo '```'
            go tool cover -func=coverage.out | sort -k3 -n | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Floor: main measured 91.7–91.9% with -coverpkg=./... over runs 37003949956..37067189671; keep ~2 points below and ratchet up.
          awk -v t="$total" 'BEGIN { if (t+0 < 90) { print "coverage " t "% is below floor 90%"; exit 1 } }'
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
