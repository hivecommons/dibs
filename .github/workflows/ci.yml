name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version drift guard
        run: |
          mod=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod | head -1)
          img=$(sed -nE 's/^FROM .*golang:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
          if [ -z "$mod" ] || [ "$mod" != "$img" ]; then
            echo "Go version drift: go.mod has '$mod' but Dockerfile builder has '$img'"; exit 1
          fi
      - name: Validate deploy manifests
        # deploy/*.yaml is applied by hand (deploy/README.md); a schema or
        # indentation error otherwise surfaces only at `kubectl apply`.
        run: |
          set -euo pipefail
          ver=v0.7.0
          sum=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          curl -sSL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz"
          echo "${sum}  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
          ./kubeconform -strict -summary deploy/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format and module tidiness
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: the following files need formatting:"; echo "$unformatted"; exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1
          }
      - name: Test
        run: |
          go test -race -count=1 \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          {
            echo "### Go coverage (\`-coverpkg=./...\`): ${total}%"
            echo
            echo '```'
            go tool cover -func=coverage.out | sort -k3 -n | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Floor: main measured 93.7–95.3% with -coverpkg=./... over runs 37113250020..37171801189; keep ~2 points below and ratchet up.
          awk -v t="$total" 'BEGIN { if (t+0 < 93) { print "coverage " t "% is below floor 93%"; exit 1 } }'
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
