name: Go Security

# Reachability-based vulnerability scan. Complements `go vet` in ci.yml and
# Dependabot: govulncheck only fails when this module actually CALLS a
# vulnerable symbol, so findings are actionable rather than version noise.
# The weekly cron exists because an advisory against unchanged code appears
# in the vuln database, not in a diff — a push-only trigger cannot catch it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
