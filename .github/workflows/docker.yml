name: Docker

# Publishes ghcr.io/hivecommons/dibs on every push to main whose CI run is green:
# `latest` plus the full commit sha, so deployments can pin exactly what they run
# and the `--version` freshness probe matches the deployed manifest.
on:
  # Publish only after CI (build/vet/test/coverage) is green on main, so a
  # red main never becomes `latest`. workflow_run carries the triggering
  # commit in github.event.workflow_run.head_sha; github.sha is NOT it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # No paths filter: build-check is a required status check, and a
  # path-filtered workflow leaves required checks permanently pending
  # ("Expected — Waiting for status to be reported") on PRs whose diff
  # doesn't touch the filtered paths. The job is cheap on docs-only PRs
  # since the Go layers are fully cached via cache-from: type=gha.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          # Hub cluster (OKE) runs arm64 Ampere nodes; build both arches.
          platforms: linux/amd64,linux/arm64
          # GIT_HASH is passed explicitly because Actions checkouts are
          # detached; the Dockerfile stamps it into the binary via ldflags.
          build-args: |
            GIT_HASH=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
