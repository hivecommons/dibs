# Keeps Go modules, Docker base images, and GitHub Actions current.
# Weekly cadence, grouped where safe, to limit PR noise on a small repo.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    # Daily, not weekly: the builder image is digest-pinned and the
    # builder-lag job in go-security.yml goes red when a Go point release
    # lands, so the bump PR should arrive within hours rather than a week.
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
