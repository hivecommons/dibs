# Backing storage for the JSON file store (ideas, repo profiles,
# notifications). ReadWriteMany (OCI FSS/NFS) so rollouts can overlap
# old and new pods (RollingUpdate, zero downtime). The store remains
# single-writer by design; the only concurrent access is the brief
# handoff during a rollout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dibs-data-rwx
  namespace: dibs
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: oci-fss
  resources:
    requests:
      storage: 50Gi
