# Optional: requires the Prometheus Operator CRDs (see deploy/README.md).
# Scrapes the internal "metrics" port of the dibs Service; the ingress only
# routes the "http" port, so /metrics is never publicly reachable.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dibs
  namespace: dibs
  labels:
    app: dibs
spec:
  selector:
    matchLabels:
      app: dibs
  endpoints:
    # The exporter emits dibs_background_job_* metrics with a label named `job` (the background-job name).
    # `job` is Prometheus's reserved target label. Without honorLabels, Prometheus would rename the
    # exporter's label to `exported_job`, breaking the sum by (job) alerts and dashboard selectors.
    - port: metrics
      path: /metrics
      interval: 30s
      honorLabels: true
