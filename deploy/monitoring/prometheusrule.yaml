# Optional: requires the Prometheus Operator CRDs (see deploy/README.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dibs
  namespace: dibs
  labels:
    app: dibs
spec:
  groups:
    - name: dibs
      rules:
        - alert: DibsHigh5xxRatio
          expr: |
            sum(rate(dibs_http_requests_total{status_class="5xx"}[5m]))
              / sum(rate(dibs_http_requests_total[5m])) > 0.005
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#1-triage-first-5-minutes
            summary: More than 0.5% of Dibs requests are failing with 5xx.
        - alert: DibsHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(dibs_http_request_duration_seconds_bucket{route_group!="readyz"}[5m]))
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#1-triage-first-5-minutes
            summary: Dibs p95 request latency has been above 1s for 15 minutes.
        - alert: DibsReadyzFailing
          expr: sum(increase(dibs_http_requests_total{route_group="readyz",status_class="5xx"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#2-decide
            summary: Dibs /readyz is failing; the store data directory is not usable.
        - alert: DibsDown
          expr: absent(up{namespace="dibs",job="dibs"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#2-decide
            summary: No Dibs pod is being scraped successfully; the service may be fully down. The request-based alerts cannot fire when there is no traffic data.
        - alert: DibsBackgroundJobFailing
          expr: sum by (job) (increase(dibs_background_job_runs_total{result="error"}[30m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#5-background-job-alerts
            summary: Dibs background job {{ $labels.job }} is failing.
        - alert: DibsBackgroundJobStale
          expr: time() - dibs_background_job_last_success_timestamp_seconds > 3600
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#5-background-job-alerts
            summary: Dibs background job {{ $labels.job }} has not succeeded for over an hour.
        - alert: DibsMatchLLMErrorRatio
          expr: |
            sum by (op) (increase(dibs_match_llm_calls_total{outcome="llm_error"}[30m]))
              / sum by (op) (increase(dibs_match_llm_calls_total[30m])) > 0.5
            and sum by (op) (increase(dibs_match_llm_calls_total[30m])) >= 5
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#6-match-engine-llm-alert
            summary: More than half of Dibs match-engine LLM calls for op {{ $labels.op }} are failing.
        - alert: DibsPodRestarting
          # Needs kube-state-metrics. Catches OOM kills and crash loops that
          # recover between scrapes, which DibsDown (absent up) does not see.
          expr: increase(kube_pod_container_status_restarts_total{namespace="dibs",container="dibs"}[30m]) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/hivecommons/dibs/blob/main/runbooks/incident-response.md#7-pod-restart-alert
            summary: Dibs container has restarted 3 or more times in 30 minutes.
