# Manual backup helper (runbooks/data-recovery.md). Not part of the normal
# apply list: create it, stream the backup, delete it. It mounts the data
# claim read-only and expires on its own after an hour.
apiVersion: v1
kind: Pod
metadata:
  name: dibs-backup-manual
  namespace: dibs
  labels:
    app.kubernetes.io/name: dibs-backup
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 3600
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: backup
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      volumeMounts:
        - {name: data, mountPath: /data, readOnly: true}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dibs-data-rwx
        readOnly: true
