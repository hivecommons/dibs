# Placeholder — do NOT apply as-is. Create the real secret out of band:
#
#   kubectl -n ideate create secret generic ideate-secrets \
#     --from-literal=IDEATE_GITHUB_TOKEN=ghp_... \
#     --from-literal=IDEATE_LLM_BASE_URL=https://... \
#     --from-literal=IDEATE_LLM_API_KEY=sk-...
#
# All keys are optional: without IDEATE_GITHUB_TOKEN accepts are recorded but
# settlement issues are not opened; without IDEATE_LLM_* the deterministic
# fallback matcher is used.
apiVersion: v1
kind: Secret
metadata:
  name: ideate-secrets
  namespace: ideate
type: Opaque
stringData:
  IDEATE_GITHUB_TOKEN: ""
  IDEATE_LLM_BASE_URL: ""
  IDEATE_LLM_API_KEY: ""
  IDEATE_LLM_MODEL: ""
