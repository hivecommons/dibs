# Placeholder — do NOT apply as-is. Create the real secret out of band:
#
#   kubectl -n dibs create secret generic dibs-secrets \
#     --from-literal=DIBS_GITHUB_TOKEN=ghp_... \
#     --from-literal=DIBS_LLM_BASE_URL=https://... \
#     --from-literal=DIBS_LLM_API_KEY=sk-...
#
# All keys are optional: without DIBS_GITHUB_TOKEN accepts are recorded but
# settlement issues are not opened; without DIBS_LLM_* the deterministic
# fallback matcher is used.
apiVersion: v1
kind: Secret
metadata:
  name: dibs-secrets
  namespace: dibs
type: Opaque
stringData:
  DIBS_GITHUB_TOKEN: ""
  DIBS_LLM_BASE_URL: ""
  DIBS_LLM_API_KEY: ""
  DIBS_LLM_MODEL: ""
