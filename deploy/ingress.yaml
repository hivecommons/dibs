# Requires: DNS record for idea.kubestellar.io → the cluster ingress LB,
# and a cert-manager ClusterIssuer named "letsencrypt" (adjust if yours
# differs).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ideate
  namespace: ideate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - idea.kubestellar.io
      secretName: ideate-tls
  rules:
    - host: idea.kubestellar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ideate
                port:
                  name: http
