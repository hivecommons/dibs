# Requires: DNS record for dibs.kubestellar.io → the cluster ingress LB,
# and a cert-manager ClusterIssuer named "letsencrypt-prod" (adjust if yours
# differs).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dibs
  namespace: dibs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The /mcp Streamable HTTP endpoint may return SSE responses; avoid
    # buffering streaming tool responses behind ingress-nginx.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dibs.kubestellar.io
      secretName: dibs-tls
  rules:
    - host: dibs.kubestellar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dibs
                port:
                  name: http
