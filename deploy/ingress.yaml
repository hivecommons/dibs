# Requires: DNS record for dibs.kubestellar.io → the cluster ingress LB,
# and a cert-manager ClusterIssuer named "letsencrypt" (adjust if yours
# differs).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dibs
  namespace: dibs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dibs.kubestellar.io
      secretName: dibs-tls
  rules:
    - host: dibs.kubestellar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dibs
                port:
                  name: http
