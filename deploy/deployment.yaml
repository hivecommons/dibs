apiVersion: apps/v1
kind: Deployment
metadata:
  name: dibs
  namespace: dibs
  labels:
    app: dibs
spec:
  # Single replica: the JSON file store is single-writer (RWO PVC).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dibs
  template:
    metadata:
      labels:
        app: dibs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dibs
          # Pin to a commit sha in production; latest tracks main.
          image: ghcr.io/kubestellar/dibs:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dibs-config
            - secretRef:
                name: dibs-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dibs-data
