apiVersion: apps/v1
kind: Deployment
metadata:
  name: dibs
  namespace: dibs
  labels:
    app: dibs
spec:
  # Single replica; the RWX volume lets the replacement pod start
  # before the old one stops, so rollouts serve traffic throughout.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dibs
  template:
    metadata:
      labels:
        app: dibs
    spec:
      # Must stay above shutdownTimeout (20s, cmd/dibs/main.go) so SIGTERM
      # drains in-flight requests before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
      # Dibs never calls the Kubernetes API (hub, GitHub and the LLM gateway
      # are all plain HTTP), so the pod has no use for a service-account
      # token; leaving one mounted only hands it to anyone who finds a hole
      # in the public HTTP surface.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dibs
          # main 70a2db52dcc3878f66d11f34e5f5d3dccfd3e900; reviewed rollout: deploy/rollout-558.md
          image: ghcr.io/hivecommons/dibs@sha256:b65c4f332415c1c68c4812e0948d9356180e5f48c6ae2f7443346698c6745079
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: dibs-config
            - secretRef:
                name: dibs-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only, so os.TempDir() needs a
            # writable volume: chunked voice recordings are assembled in
            # /tmp (pkg/intake/chunks.go) and multipart parsing may spill
            # there. Audio is deleted on finish, abort or idle expiry.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # Room for the parent holding an upload (DIBS_INTAKE_MAX_MB,
            # default 25 MB, plus copies) while the document extraction
            # worker child runs with its own ~160 MiB data budget
            # (pkg/intake/worker.go); both count against this one limit.
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dibs-data-rwx
        - name: tmp
          emptyDir:
            # 16 concurrent recording sessions (maxChunkSessions) at the
            # 25 MB upload cap is 400 MB; the rest is multipart slack.
            sizeLimit: 512Mi
