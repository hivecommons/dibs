apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideate
  namespace: ideate
  labels:
    app: ideate
spec:
  # Single replica: the JSON file store is single-writer (RWO PVC).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ideate
  template:
    metadata:
      labels:
        app: ideate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ideate
          # Pin to a commit sha in production; latest tracks main.
          image: ghcr.io/kubestellar/ideate:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ideate-config
            - secretRef:
                name: ideate-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ideate-data
